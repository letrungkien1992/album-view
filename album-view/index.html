<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album Viewer</title>
    <link rel="icon" type="image/svg+xml" href="/resources/album-resource/favicon.svg" />
    <link rel="shortcut icon" href="/resources/album-resource/favicon.svg" />
    <link rel="stylesheet" href="/resources/album-resource/album-viewer.css" />
  </head>
  <body>
    <div class="album-app">
      <button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-label="Open menu" title="Open menu">
        <span id="mobile-menu-toggle-icon" aria-hidden="true">
          <svg class="icon-menu icon-stroke" viewBox="0 0 24 24">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
          <svg class="icon-close icon-stroke" viewBox="0 0 24 24">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </span>
      </button>
      <div id="mobile-sidebar-overlay" class="mobile-sidebar-overlay" aria-hidden="true"></div>
      <aside class="album-sidebar">
        <div class="sidebar-brand">
          <h1 id="sidebar-title">Album Ảnh</h1>
        </div>
        <button id="sidebar-toggle" type="button" aria-label="Thu gọn menu" title="Thu gọn menu">
          <span id="sidebar-toggle-icon" aria-hidden="true">
            <svg class="icon-collapse icon-stroke" viewBox="0 0 24 24">
              <polyline points="14,6 8,12 14,18"></polyline>
            </svg>
            <svg class="icon-expand icon-stroke" viewBox="0 0 24 24">
              <polyline points="10,6 16,12 10,18"></polyline>
            </svg>
          </span>
        </button>
        <p id="sidebar-hint" class="hint">Nguồn ảnh: <code>src/albums</code></p>
        <div class="sidebar-search">
          <input id="album-search-input" type="text" placeholder="Tìm kiếm" />
          <button id="album-search-clear" class="search-clear is-hidden" type="button" aria-label="Clear search" title="Clear search">
            <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18"></line>
              <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
          </button>
          <span class="search-icon" aria-hidden="true">
            <svg class="icon-stroke" viewBox="0 0 24 24">
              <circle cx="10.5" cy="10.5" r="5.5"></circle>
              <line x1="15" y1="15" x2="20" y2="20"></line>
            </svg>
          </span>
        </div>
        <ul id="album-list"></ul>
      </aside>

      <main class="album-main">
        <header class="album-header">
          <div class="album-header-top">
            <h2 id="album-title">Chưa chọn album</h2>
            <button id="album-slideshow-toggle" class="album-slideshow-toggle" type="button" aria-label="Trình chiếu" title="Trình chiếu">
              <svg class="icon-stroke icon-slideshow" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="12" rx="1.5" ry="1.5"></rect>
                <line x1="8" y1="20" x2="16" y2="20"></line>
                <polygon points="10,8 15,11 10,14"></polygon>
              </svg>
            </button>
          </div>
          <p id="album-description">Chọn album bên trái để xem ảnh.</p>
        </header>

        <div id="image-grid-wrap" class="image-grid-wrap">
          <div id="grid-loading-overlay" class="grid-loading-overlay is-hidden" aria-hidden="true">
            <span class="grid-loading-line"></span>
          </div>
          <section id="image-grid" class="image-grid"></section>
        </div>
      </main>
    </div>

    <div class="settings-dock">
      <button id="settings-toggle" type="button" aria-label="Settings">
        <svg class="icon-stroke settings-gear" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1z"></path>
        </svg>
      </button>
      <div id="settings-panel" class="settings-panel is-hidden">
        <p id="language-label">Ngôn ngữ</p>
        <div id="language-switches" class="language-switches"></div>
        <p id="theme-section-label">Theme</p>
        <p id="mode-label">Mode</p>
        <div id="theme-options" class="theme-options"></div>
        <p id="color-label">Color</p>
        <div id="color-options" class="theme-options color-options"></div>
        <p id="radius-label">Bo góc</p>
        <div class="radius-control">
          <input id="radius-range" type="range" min="0" max="2" step="0.05" value="1" />
          <span id="radius-value">1.00x</span>
        </div>
      </div>
    </div>

    <template id="image-item-template">
      <article class="image-card">
        <div class="thumb-media">
          <img loading="lazy" alt="" />
          <span class="thumb-loading-line" aria-hidden="true"></span>
        </div>
        <div class="card-footer">
          <p class="caption"></p>
          <a class="thumb-download" href="#" download aria-label="Download original" title="Download original">
            <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
              <line x1="12" y1="4" x2="12" y2="14"></line>
              <polyline points="8,10 12,14 16,10"></polyline>
              <path d="M5 18h14"></path>
            </svg>
          </a>
        </div>
      </article>
    </template>

    <div id="image-viewer" class="image-viewer is-hidden" aria-hidden="true">
      <div class="image-viewer-layout">
        <div class="image-viewer-left">
          <p id="image-viewer-caption" class="image-viewer-caption"></p>
          <div class="image-viewer-slideshow-head">
            <p id="image-viewer-slideshow-counter" class="image-viewer-slideshow-counter">1 / 1</p>
            <button id="image-viewer-slideshow-toggle" type="button" aria-label="Pause slideshow" title="Pause slideshow">
              <svg class="icon-stroke icon-play" viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="8,6 18,12 8,18"></polygon>
              </svg>
              <svg class="icon-stroke icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="9" y1="6" x2="9" y2="18"></line>
                <line x1="15" y1="6" x2="15" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="image-viewer-stage">
            <div id="image-viewer-loading" class="image-viewer-loading is-hidden" aria-hidden="true">
              <span class="spinner"></span>
            </div>
            <div id="image-viewer-canvas" class="image-viewer-canvas">
              <img id="image-viewer-img" alt="" />
            </div>
            <div class="image-viewer-stage-nav">
              <button id="image-viewer-stage-prev" type="button" aria-label="Previous image" title="Previous image">
                <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="15,6 9,12 15,18"></polyline>
                </svg>
              </button>
              <button id="image-viewer-stage-next" type="button" aria-label="Next image" title="Next image">
                <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="9,6 15,12 9,18"></polyline>
                </svg>
              </button>
            </div>
          </div>
          <div class="image-viewer-actions">
            <div class="image-viewer-rotate-group">
              <button id="image-viewer-rotate-left" type="button" aria-label="Rotate left" title="Rotate left">
                <svg class="icon-stroke rotate-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <g transform="translate(24 0) scale(-1 1)">
                    <path d="M18 9a8 8 0 1 0-1 8.8"></path>
                    <path d="M13 9h5V4"></path>
                  </g>
                </svg>
              </button>
              <button id="image-viewer-rotate-right" type="button" aria-label="Rotate right" title="Rotate right">
                <svg class="icon-stroke rotate-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 9a8 8 0 1 0-1 8.8"></path>
                  <path d="M13 9h5V4"></path>
                </svg>
              </button>
            </div>
            <div class="image-viewer-zoom-group">
              <button id="image-viewer-zoom-out" type="button" aria-label="Zoom out">
                <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <button id="image-viewer-zoom-reset" type="button" aria-label="Reset zoom">1x</button>
              <button id="image-viewer-zoom-in" type="button" aria-label="Zoom in">
                <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="image-viewer-right">
          <div class="image-viewer-right-top">
            <button id="image-viewer-close" type="button" aria-label="Close">
              <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="image-viewer-rail">
            <div class="image-viewer-nav" aria-hidden="false">
              <button id="image-viewer-prev" type="button" aria-label="Previous image" title="Previous image">
                <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="6,14 12,8 18,14"></polyline>
                </svg>
              </button>
              <button id="image-viewer-next" type="button" aria-label="Next image" title="Next image">
                <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="6,10 12,16 18,10"></polyline>
                </svg>
              </button>
            </div>
            <aside class="image-viewer-sidebar" aria-label="Image list">
              <div id="image-viewer-thumb-list" class="image-viewer-thumb-list"></div>
            </aside>
          </div>
          <div class="image-viewer-right-bottom">
            <div class="image-viewer-right-tools">
              <button id="image-viewer-sidebar-toggle" type="button" aria-label="Hide sidebar" title="Hide sidebar">
                <svg class="icon-panel-open icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="1.5" ry="1.5"></rect>
                  <line x1="17" y1="4" x2="17" y2="20"></line>
                  <polyline points="11,8 14,12 11,16"></polyline>
                </svg>
                <svg class="icon-panel-close icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="1.5" ry="1.5"></rect>
                  <line x1="17" y1="4" x2="17" y2="20"></line>
                  <polyline points="13,8 10,12 13,16"></polyline>
                </svg>
              </button>
              <a id="image-viewer-download" class="image-viewer-download" href="#" download aria-label="Download original" title="Download original">
                <svg class="icon-stroke" viewBox="0 0 24 24" aria-hidden="true">
                  <line x1="12" y1="4" x2="12" y2="14"></line>
                  <polyline points="8,10 12,14 16,10"></polyline>
                  <path d="M5 18h14"></path>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="/resources/album-resource/album-viewer.js"></script>
  </body>
</html>
