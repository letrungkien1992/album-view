<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Album Viewer</title>
    <link rel="icon" type="image/svg+xml" href="resources/album-resource/favicon.svg" />
    <link rel="stylesheet" href="resources/album-resource/login.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-backdrop" aria-hidden="true"></div>
      <div class="login-sparkles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <section class="login-stage" aria-label="Màn hình đăng nhập">
        <form id="login-form" class="login-card" autocomplete="off">
          <h1 id="login-title" class="login-title" data-i18n="login_title">Đăng nhập</h1>
          <p class="login-subtitle" data-i18n="login_subtitle">Đăng nhập quản lý hình ảnh.</p>
          <div class="field-group">
            <label class="sr-only" for="username" data-i18n="login_username_label"
              >Tên đăng nhập</label
            >
            <div class="input-row">
              <span class="field-icon" aria-hidden="true">
                <svg class="icon-stroke" viewBox="0 0 24 24">
                  <path d="M20 21a8 8 0 0 0-16 0"></path>
                  <circle cx="12" cy="8" r="4"></circle>
                </svg>
              </span>
              <input
                id="username"
                name="username"
                type="text"
                required
                placeholder="Nhập username"
                data-i18n-placeholder="login_username_placeholder"
              />
            </div>
          </div>

          <div class="field-group">
            <label class="sr-only" for="password" data-i18n="login_password_label"
              >Mật khẩu</label
            >
            <div class="input-row">
              <span class="field-icon" aria-hidden="true">
                <svg class="icon-stroke" viewBox="0 0 24 24">
                  <path d="M4 7h16v10H4z"></path>
                  <path d="m4 7 8 6 8-6"></path>
                </svg>
              </span>
              <input
                id="password"
                name="password"
                type="password"
                required
                placeholder="Nhập password"
                data-i18n-placeholder="login_password_placeholder"
              />
              <button
                id="password-toggle"
                class="password-toggle"
                type="button"
                aria-label="Toggle password visibility"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
              </button>
            </div>
          </div>

          <div class="actions">
            <a class="login-btn ghost" href="./" data-i18n="login_back">BACK</a>
            <button
              id="login-submit"
              class="login-btn"
              type="submit"
              data-i18n="login_submit"
            >
              LOGIN
            </button>
          </div>

          <p id="login-error" class="login-error" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="resources/album-resource/login.js"></script>
  </body>
</html>
